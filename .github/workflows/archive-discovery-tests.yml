name: Archive Discovery tests

on:
  push:
    paths:
      - "experiments/archive-discovery-engine/**"
      - ".github/workflows/archive-discovery-tests.yml"
  pull_request:
    paths:
      - "experiments/archive-discovery-engine/**"
      - ".github/workflows/archive-discovery-tests.yml"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: experiments/archive-discovery-engine
        run: python -m unittest discover -s tests -v
      - name: Smoke-test synthetic baseline
        working-directory: experiments/archive-discovery-engine
        run: python archive_discovery.py --top-k 3
